name: Latest signed APK

# Rolling public release-signed APK from main (same cert as create-release.sh).
# Requires repo secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. See docs/RELEASE.md.
on:
  push:
    branches: [main]

concurrency:
  group: latest-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  latest:
    name: latest-signed-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      - name: Resolve base versions
        id: ver
        run: |
          set -euo pipefail
          CODE=$(sed -nE 's/.*val baseVersionCode = ([0-9]+).*/\1/p' composeApp/build.gradle.kts | head -1)
          NAME=$(sed -nE 's/.*val baseVersionName = "([^"]+)".*/\1/p' composeApp/build.gradle.kts | head -1)
          if [[ -z "${CODE}" || -z "${NAME}" ]]; then
            echo "::error::Could not parse baseVersionCode/baseVersionName from composeApp/build.gradle.kts"
            exit 1
          fi
          CI_CODE=$(( CODE * 100000 + ${{ github.run_number }} ))
          CI_NAME="${NAME}-latest.${{ github.run_number }}"
          echo "base_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "base_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "ci_code=$CI_CODE" >> "$GITHUB_OUTPUT"
          echo "ci_name=$CI_NAME" >> "$GITHUB_OUTPUT"
          echo "Base versionCode=$CODE versionName=$NAME → CI $CI_CODE / $CI_NAME"

      - name: Materialize release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" || -z "${RELEASE_KEYSTORE_PASSWORD}" \
             || -z "${RELEASE_KEY_ALIAS}" || -z "${RELEASE_KEY_PASSWORD}" ]]; then
            echo "::error::Missing release signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KS"
          test -s "$KS"
          printf '%s\n' \
            "storeFile=$KS" \
            "storePassword=${RELEASE_KEYSTORE_PASSWORD}" \
            "keyAlias=${RELEASE_KEY_ALIAS}" \
            "keyPassword=${RELEASE_KEY_PASSWORD}" \
            > keystore.properties

      - name: Assemble signed release
        run: |
          set -euo pipefail
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace \
            -PciVersionCode=${{ steps.ver.outputs.ci_code }} \
            -PciVersionName=${{ steps.ver.outputs.ci_name }}

      - name: Package latest APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(ls composeApp/build/outputs/apk/release/*.apk | grep -v unsigned | head -1 || true)
          if [[ -z "${SRC}" ]]; then
            echo "::error::No signed APK found (only unsigned?). Check keystore.properties / secrets."
            ls -la composeApp/build/outputs/apk/release/ || true
            exit 1
          fi
          OUT="dist/com.domivega.gps_car-latest.apk"
          cp "$SRC" "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Ensure prerelease latest exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            echo "Release latest already exists"
          else
            gh release create latest \
              --prerelease \
              --title "Continuous (latest)" \
              --notes "Rolling signed APK from \`main\`. Not an F-Droid/store version. versionName includes \`-latest.<run>\`."
          fi

      - name: Upload latest APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload latest "${{ steps.apk.outputs.apk_path }}" --clobber

      - name: Scrub keystore from workspace
        if: always()
        run: |
          rm -f keystore.properties "${RUNNER_TEMP}/release.jks" || true
