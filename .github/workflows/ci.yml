name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      # PRs only: prove release package builds without signing secrets.
      # On main, Latest signed APK does the single assembleRelease after CI is green.
      - name: Assemble release (unsigned)
        if: github.event_name == 'pull_request'
        run: ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned release APK
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-release-unsigned
          path: |
            composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
