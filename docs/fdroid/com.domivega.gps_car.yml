# fdroiddata metadata for GPS Car Tracking (draft mirror of submitted recipe).
# Submitted MR: https://gitlab.com/fdroid/fdroiddata/-/merge_requests/45659
# Copy path for updates: fdroiddata/metadata/com.domivega.gps_car.yml
# Builds[].commit must be the full git commit hash of the release tag.
#
# applicationId / package: com.domivega.gps_car
# Upstream Fastlane: fastlane/metadata/android/en-US/ (full_description is HTML)
# gradle "yes" + subdir composeApp → assembleRelease (not a flavor named composeApp).
# Reproducible builds: Binaries points at GitHub Releases; AllowedAPKSigningKeys is cert SHA-256.

Categories:
  - Connectivity
  - Navigation
License: MIT
AuthorName: Luis Felipe Domínguez Vega
SourceCode: https://github.com/lfdominguez/my-car-tracking-mobile-app
IssueTracker: https://github.com/lfdominguez/my-car-tracking-mobile-app/issues

RepoType: git
Repo: https://github.com/lfdominguez/my-car-tracking-mobile-app.git
Binaries: https://github.com/lfdominguez/my-car-tracking-mobile-app/releases/download/v%v/com.domivega.gps_car_%c.apk

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: 166097568c132a9e0089331d146282fdc55c5038
    subdir: composeApp
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - yes
    output: build/outputs/apk/release/composeApp-release-unsigned.apk
    rm:
      - devenv.nix
      - devenv.yaml
      - devenv.lock

AllowedAPKSigningKeys: 99b333a9c90167524c05aec416e712e83285df80fa01e2e49eb318b1f2b1cee1

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: composeApp/build.gradle.kts|versionCode = (\d+)|.|versionName = "(.*)"
