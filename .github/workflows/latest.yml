name: Latest signed APK

# Rolling public release-signed APK from main (same cert as create-release.sh).
# After CI succeeds on main: download CI's unsigned APK and sign only — no recompile.
# Requires repo secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. See docs/RELEASE.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: latest-apk-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  latest:
    name: latest-signed-apk
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download CI unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: composeApp-release-unsigned
          path: ci-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Android SDK (build-tools for apksigner)
        uses: android-actions/setup-android@v3

      - name: Materialize release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KS"
          test -s "$KS"
          echo "KS=$KS" >> "$GITHUB_ENV"

      - name: Sign APK (zipalign + apksigner only)
        id: apk
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_PASSWORD}" || -z "${RELEASE_KEY_ALIAS}" || -z "${RELEASE_KEY_PASSWORD}" ]]; then
            echo "::error::Missing release signing secrets (RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD)"
            exit 1
          fi
          mkdir -p dist
          ls -la ci-apk/ || true
          # Artifact may nest under release/ or be flat.
          SRC=$(find ci-apk -type f -name '*.apk' | head -1 || true)
          if [[ -z "${SRC}" ]]; then
            echo "::error::No APK in CI artifact composeApp-release-unsigned"
            find ci-apk -type f || true
            exit 1
          fi
          echo "Unsigned source: $SRC (commit ${{ github.event.workflow_run.head_sha }})"

          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"/* 2>/dev/null | sort -V | tail -1)
          if [[ -z "${BT}" || ! -x "${BT}/apksigner" ]]; then
            echo "::error::Android build-tools apksigner not found under ANDROID_HOME=${ANDROID_HOME:-} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" || true
            exit 1
          fi
          echo "Using build-tools: $BT"

          ALIGNED="$RUNNER_TEMP/aligned.apk"
          OUT="dist/com.domivega.gps_car-latest.apk"
          # Re-align even if already aligned; -f overwrites.
          "${BT}/zipalign" -p -f 4 "$SRC" "$ALIGNED"
          "${BT}/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:${RELEASE_KEYSTORE_PASSWORD}" \
            --ks-key-alias "${RELEASE_KEY_ALIAS}" \
            --key-pass "pass:${RELEASE_KEY_PASSWORD}" \
            --out "$OUT" \
            "$ALIGNED"
          "${BT}/apksigner" verify --verbose "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      # No checkout: gh would look for .git; pin the repo via GH_REPO.
      - name: Ensure prerelease latest exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            echo "Release latest already exists"
          else
            gh release create latest \
              --prerelease \
              --title "Continuous (latest)" \
              --notes "Rolling signed APK from \`main\`. Not an F-Droid/store version. Built by signing CI's unsigned APK (no second compile)."
          fi

      - name: Upload latest APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload latest "${{ steps.apk.outputs.apk_path }}" --clobber

      - name: Scrub keystore from workspace
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/release.jks" "${RUNNER_TEMP}/aligned.apk" || true
