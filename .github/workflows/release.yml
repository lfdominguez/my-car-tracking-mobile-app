name: Release

# Tag-driven verification build. Signed F-Droid reference APKs are produced by
# scripts/create-release.sh (local keystore) and attached to the GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read versions from Gradle
        id: ver
        run: |
          set -euo pipefail
          CODE=$(sed -nE 's/.*val baseVersionCode = ([0-9]+).*/\1/p' composeApp/build.gradle.kts | head -1)
          NAME=$(sed -nE 's/.*val baseVersionName = "([^"]+)".*/\1/p' composeApp/build.gradle.kts | head -1)
          if [[ -z "${CODE}" ]]; then
            CODE=$(sed -nE 's/.*versionCode\s*=\s*([0-9]+).*/\1/p' composeApp/build.gradle.kts | head -1)
          fi
          if [[ -z "${NAME}" ]]; then
            NAME=$(sed -nE 's/.*versionName\s*=\s*"([^"]+)".*/\1/p' composeApp/build.gradle.kts | head -1)
          fi
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$NAME versionCode=$CODE tag=${GITHUB_REF_NAME}"

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble release (unsigned CI artifact)
        run: ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Package CI APK artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(ls composeApp/build/outputs/apk/release/*.apk | head -1)
          OUT="dist/com.domivega.gps_car_${{ steps.ver.outputs.version_code }}-ci-unsigned.apk"
          cp "$SRC" "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_ENV"
          ls -la dist/

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Release ${{ steps.ver.outputs.version_name }} (versionCode ${{ steps.ver.outputs.version_code }})."
          fi

      - name: Upload CI unsigned APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          # Do not overwrite the developer-signed F-Droid asset name.
          gh release upload "$TAG" "$apk_path" --clobber
