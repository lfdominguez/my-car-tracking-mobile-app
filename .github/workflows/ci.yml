name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon --stacktrace

      # One unsigned release APK per run. On main, stamp rolling latest versions so
      # Latest can sign this artifact without a second compile.
      - name: Resolve rolling versions (main)
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          CODE=$(sed -nE 's/.*val baseVersionCode = ([0-9]+).*/\1/p' composeApp/build.gradle.kts | head -1)
          NAME=$(sed -nE 's/.*val baseVersionName = "([^"]+)".*/\1/p' composeApp/build.gradle.kts | head -1)
          if [[ -z "${CODE}" || -z "${NAME}" ]]; then
            echo "::error::Could not parse baseVersionCode/baseVersionName from composeApp/build.gradle.kts"
            exit 1
          fi
          CI_CODE=$(( CODE * 100000 + ${{ github.run_number }} ))
          CI_NAME="${NAME}-latest.${{ github.run_number }}"
          echo "ci_code=$CI_CODE" >> "$GITHUB_OUTPUT"
          echo "ci_name=$CI_NAME" >> "$GITHUB_OUTPUT"
          echo "Rolling versionCode=$CI_CODE versionName=$CI_NAME"

      - name: Assemble release (unsigned, main stamped)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace \
            -PciVersionCode=${{ steps.ver.outputs.ci_code }} \
            -PciVersionName=${{ steps.ver.outputs.ci_name }}

      - name: Assemble release (unsigned, PR base versions)
        if: github.event_name == 'pull_request'
        run: ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-release-unsigned
          path: |
            composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
